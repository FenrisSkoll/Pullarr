name: Bug Report
description: Create a report for a bug or inconsistency that you found
labels: ["bug"]
body:
- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an issue already exists for the bug you encountered.
    options:
    - label: I have searched the existing issues
      required: true

- type: textarea
  attributes:
    label: Description of the bug
    description: A concise description of what the bug is.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: Concise steps to reproduce the behaviour.
    placeholder: |
      1. Go to '...'
      2. Click on '....'
      3. Scroll down to '....'
      4. See error
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected behaviour
    description: What should've happened, or did you expect to happen?
  validations:
    required: true

- type: textarea
  attributes:
    label: Additional context
    description: >-
      Share only a minimal, reviewed excerpt or synthetic reproduction. Remove
      API keys, passwords, cookies, private URLs, personal paths and comic content
      from logs and screenshots. Do not upload a database, complete log archive,
      browser profile or download. For security issues, follow SECURITY.md.
  validations:
    required: false

- type: textarea
  attributes:
    label: Environment and version info
    placeholder: Go to System -> Status -> About, click "Copy" and paste the value here. Also share your OS and/or browser if relevant.
  validations:
    required: true
